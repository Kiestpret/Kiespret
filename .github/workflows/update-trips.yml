name: Update trips from Corendon feed

on:
  schedule:
    - cron: '0 6 * * *'   # Dagelijks om 06:00 UTC (08:00 NL zomertijd)
  workflow_dispatch:        # Handmatig triggeren via GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # nodig om de bijgewerkte trips.js terug naar main te kunnen pushen
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Corendon feed
        run: node feed-parser/fetch-feed.js
        env:
          TRADETRACKER_FEED_URL: ${{ secrets.TRADETRACKER_FEED_URL }}

      - name: Map feed to trips format
        run: node feed-parser/map-trips.js

      - name: Validate trips
        run: node feed-parser/validate.js

      - name: Build trips.js
        run: node feed-parser/build-trips.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet trips.js feed-parser/trips.json 2>/dev/null && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trips.js feed-parser/trips.json
          git commit -m "chore: update trips from Corendon feed ($(date +%Y-%m-%d))"
          git push
